<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Baru</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100vh;
    margin: 0;
    padding: 0;
    background: transparent;
    color: @FG@;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  .clock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    @CLOCK_DISP@
  }
  .clock {
    font-size: 68px;
    font-weight: 300;
    color: #F4F4F5;
    letter-spacing: -2px;
    line-height: 1;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.40);
  }
  .greeting {
    font-size: 14px;
    font-weight: 400;
    color: rgba(244, 244, 245, 0.65);
    margin-top: 10px;
    letter-spacing: 0.2px;
  }
  form.search-box {
    width: 90%;
    max-width: 620px;
    display: flex;
    align-items: center;
    background: rgba(24, 24, 37, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 26px;
    padding: 8px 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    @SEARCH_DISP@
  }
  form.search-box:hover {
    border-color: rgba(255, 255, 255, 0.28);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  form.search-box:focus-within {
    border-color: @ACCENT@;
    background: rgba(28, 28, 44, 0.96);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.48), 0 0 0 1px @ACCENT@;
  }
  .search-icon {
    width: 18px;
    height: 18px;
    stroke: #F4F4F5;
    opacity: 0.85;
    flex-shrink: 0;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #F4F4F5;
    font-size: 15px;
    font-family: inherit;
    padding: 6px 14px;
  }
  input::placeholder {
    color: rgba(255, 255, 255, 0.50);
    opacity: 1;
  }
  .search-btn {
    background: transparent;
    border: none;
    color: @ACCENT@;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 10px;
    opacity: 0.9;
    border-radius: 12px;
    transition: opacity 0.15s, background 0.15s;
  }
  .search-btn:hover {
    opacity: 1;
    background: rgba(255, 255, 255, 0.10);
  }
  .tiles-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 620px;
    margin-top: 36px;
    @TILES_DISP@
  }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #F4F4F5;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.2px;
    width: 84px;
    padding: 10px 4px;
    border-radius: 18px;
    transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background 0.18s;
  }
  .tile:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.06);
  }
  .tile-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .tile:hover .tile-icon {
    border-color: rgba(255, 255, 255, 0.30);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.36);
    background: rgba(255, 255, 255, 0.12);
  }
  .tile-name {
    opacity: 0.85;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 80px;
  }
</style>
</head>
<body>
  <div class="clock-container">
    <div class="clock" id="clock">--:--</div>
    <div class="greeting" id="greeting">Memuat...</div>
  </div>
  <form class="search-box" action="@SEARCH_ACTION@" method="GET">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" name="q" placeholder="Cari di web atau ketik alamat..." autofocus autocomplete="off" />
    <button type="submit" class="search-btn">Cari</button>
  </form>
  <div class="tiles-container">
    <a class="tile" href="https://google.com">
      <div class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
      </div>
      <span class="tile-name">Google</span>
    </a>
    <a class="tile" href="https://duckduckgo.com">
      <div class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#DE5833" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.5c0 .28-.22.5-.5.5h-1c-.28 0-.5-.22-.5-.5v-1c0-.28.22-.5.5-.5h1c.28 0 .5.22.5.5v1zm2-5c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg>
      </div>
      <span class="tile-name">DuckDuckGo</span>
    </a>
    <a class="tile" href="https://github.com">
      <div class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#F4F4F5"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      </div>
      <span class="tile-name">GitHub</span>
    </a>
    <a class="tile" href="https://youtube.com">
      <div class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path fill="#FFF" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </div>
      <span class="tile-name">YouTube</span>
    </a>
    <a class="tile" href="https://wikipedia.org">
      <div class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#F4F4F5"><path d="M12.09 13.62l1.97-5.88h1.86l-3.08 8.44h-1.63L8.9 9.87l-2.3 6.31H4.97L1.92 7.74h1.72l1.94 5.97 1.83-5.97h1.53l2.29 5.88 1.97-5.88h1.72l-2.83 7.94 2.02-2.06zM22.08 7.74h1.92l-4.11 8.44h-1.67l-2.61-6.19 1.58-.2 1.86 4.45 3.03-6.5z"/></svg>
      </div>
      <span class="tile-name">Wikipedia</span>
    </a>
    <a class="tile" href="https://reddit.com">
      <div class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FF4500"/><path fill="#FFF" d="M19.3 12.3c0-.8-.6-1.4-1.4-1.4-.4 0-.8.2-1 .5-1.1-.8-2.6-1.3-4.3-1.4l.7-3.4 2.4.5c0 .6.5 1.1 1.1 1.1.6 0 1.1-.5 1.1-1.1s-.5-1.1-1.1-1.1c-.5 0-.9.3-1 .8l-2.7-.6c-.2 0-.3.1-.4.3l-.9 4c-1.7.1-3.2.6-4.3 1.4-.3-.3-.6-.5-1-.5-.8 0-1.4.6-1.4 1.4 0 .6.4 1.1.9 1.3-.1.3-.1.6-.1.9 0 2.3 2.6 4.1 5.9 4.1s5.9-1.8 5.9-4.1c0-.3 0-.6-.1-.9.5-.2.9-.7.9-1.3zm-10.4.7c0-.6.5-1.1 1.1-1.1s1.1.5 1.1 1.1-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1zm6.2 2.8c-.8.8-2.3.8-3.1.8-.8 0-2.3 0-3.1-.8-.2-.2-.2-.4 0-.6.2-.2.4-.2.6 0 .6.6 1.8.6 2.5.6.7 0 1.9 0 2.5-.6.2-.2.4-.2.6 0 .2.2.2.4 0 .6zm-.2-1.7c-.6 0-1.1-.5-1.1-1.1s.5-1.1 1.1-1.1 1.1.5 1.1 1.1-.5 1.1-1.1 1.1z"/></svg>
      </div>
      <span class="tile-name">Reddit</span>
    </a>
  </div>
  <script>
    function updateTime() {
      var d = new Date();
      var h = ('0' + d.getHours()).slice(-2);
      var m = ('0' + d.getMinutes()).slice(-2);
      var el = document.getElementById('clock');
      if (el) el.textContent = h + ':' + m;

      var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      var months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      var gEl = document.getElementById('greeting');
      if (gEl) {
        gEl.textContent = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];
      }
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
