name: Build and Release Attis

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-webengine-dev \
            libqt6svg6-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: linux
          - os: windows-latest
            artifact_name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # ---------------- Linux Setup ----------------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-webengine-dev \
            libqt6svg6-dev

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: cargo build --release

      - name: Package Linux Assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/bundle
          cp target/release/attis dist/attis-linux-x86_64
          cp target/release/attis dist/bundle/
          cp README.md dist/bundle/
          if [ -f attis.desktop ]; then cp attis.desktop dist/bundle/; fi
          if [ -f attis.svg ]; then cp attis.svg dist/bundle/; fi
          tar -czf dist/attis-linux-x86_64.tar.gz -C dist/bundle .

      # ---------------- Windows Setup ----------------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          archives: 'qtbase qtdeclarative qtsvg'

      - name: Build Windows Binary
        if: runner.os == 'Windows'
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
        run: cargo build --release

      - name: Package Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appDir = "dist\attis-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $appDir
          Copy-Item target\release\attis.exe -Destination $appDir\
          Copy-Item README.md -Destination $appDir\
          
          # Deploy Qt runtime dependencies via windeployqt
          $qtDir = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { $env:QT_DIR }
          & "$qtDir\bin\windeployqt.exe" --release --compiler-runtime --no-translations "$appDir\attis.exe"
          $global:LASTEXITCODE = 0
          
          # Ensure ALL Qt6 bin DLLs and WebEngine process are present
          if (Test-Path "$qtDir\bin") {
            Copy-Item "$qtDir\bin\*.dll" -Destination $appDir\ -Force
            if (Test-Path "$qtDir\bin\QtWebEngineProcess.exe") {
              Copy-Item "$qtDir\bin\QtWebEngineProcess.exe" -Destination $appDir\ -Force
            }
          }
          
          # Ensure MSVC C++ Runtime DLLs are present
          $redistItem = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($redistItem) {
            $redistDir = $redistItem.DirectoryName
            Copy-Item "$redistDir\*.dll" -Destination $appDir\ -Force
          }
          
          # Ensure Resources and Translations are complete
          if (Test-Path "$qtDir\resources") {
            New-Item -ItemType Directory -Force -Path "$appDir\resources"
            Copy-Item -Recurse -Force "$qtDir\resources\*" -Destination "$appDir\resources\"
          }
          if (Test-Path "$qtDir\translations\qtwebengine_locales") {
            New-Item -ItemType Directory -Force -Path "$appDir\translations\qtwebengine_locales"
            Copy-Item -Recurse -Force "$qtDir\translations\qtwebengine_locales\*" -Destination "$appDir\translations\qtwebengine_locales\"
          }
          
          # Create qt.conf to ensure Qt finds plugins and resources relative to binary
          Set-Content -Path "$appDir\qt.conf" -Value "[Paths]`nPrefix = .`nPlugins = plugins`nLibraries = .`nResources = resources`nTranslations = translations"
          
          # Duplicate plugins directory into plugins/ for qt.conf
          New-Item -ItemType Directory -Force -Path "$appDir\plugins"
          if (Test-Path "$qtDir\plugins") {
            Copy-Item -Recurse -Force "$qtDir\plugins\*" -Destination "$appDir\plugins\"
          }
          
          # Create standalone zip package (encapsulates everything neatly inside attis-windows-x86_64 folder)
          Compress-Archive -Path dist\attis-windows-x86_64 -DestinationPath dist\attis-windows-x86_64.zip -Force

      # ---------------- Upload Artifacts ----------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attis-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

      # ---------------- Release Assets ----------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/attis-linux-x86_64
            dist/attis-linux-x86_64.tar.gz
            dist/attis-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- Rolling Release (every push to main) ----------------
      - name: Upload to Rolling Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: continuous
          name: Latest development build
          prerelease: true
          files: |
            dist/attis-linux-x86_64
            dist/attis-linux-x86_64.tar.gz
            dist/attis-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
