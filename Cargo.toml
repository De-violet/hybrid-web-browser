[package]
name = "attis"
version = "0.2.0"
edition = "2021"
description = "Minimalist low-RAM web browser: Rust + Qt6 WebEngine with EasyList/uBlock ad blocking, Smart Memory tab suspension, and private mode."
license = "GPL-3.0-only"
repository = "https://github.com/De-violet/web-browser"
homepage = "https://github.com/De-violet/web-browser"
keywords = ["browser", "webengine", "adblock", "qt6", "rust"]
categories = ["gui"]
readme = "README.md"

[lib]
name = "attis"
path = "src/lib.rs"

[[bin]]
name = "attis"
path = "src/main.rs"

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
