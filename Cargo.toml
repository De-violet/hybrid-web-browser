[package]
name = "falkon-rust"
version = "0.2.0"
edition = "2021"
description = "Browser web minimalis hemat RAM: Rust + Qt6 WebEngine dengan pemblokir iklan EasyList/uBlock, Smart Memory tab suspension, dan mode penyamaran."
license = "GPL-3.0-only"
repository = "https://github.com/De-violet/web-browser"
homepage = "https://github.com/De-violet/web-browser"
keywords = ["browser", "webengine", "adblock", "qt6", "rust"]
categories = ["gui"]
readme = "README.md"

[lib]
name = "falkon_rust"
path = "src/lib.rs"

[[bin]]
name = "falkon-rust"
path = "src/main.rs"

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
